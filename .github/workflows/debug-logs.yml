name: Debug prod logs (temporal)

# Diagnóstico puntual del 500 en /api/analyze. Dispara un request fresco y
# lee los logs de runtime de Vercel con el VERCEL_TOKEN ya cargado. Se borra
# apenas se obtiene el stack trace real — no es un workflow permanente.
on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_klaQ4k4O3uyzx9gNCCsGWN91
  VERCEL_PROJECT_ID: prj_jkHBpnbq4mBSnaVkpAkvufSIzHiB

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fresh request to /api/analyze
        run: |
          curl -s -o /dev/null -w "POST /api/analyze -> %{http_code}\n" \
            -X POST -H "Content-Type: application/json" -d '{}' \
            https://selvoro.vercel.app/api/analyze
          curl -s -o /dev/null -w "GET / -> %{http_code}\n" https://selvoro.vercel.app/

      - name: Wait for logs to land
        run: sleep 5

      - name: Fetch runtime error logs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@58.7.1 logs \
            --status-code 500 \
            --expand \
            --since 10m \
            --project "$VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            --non-interactive || true
          echo "---- level=error, ultimos 10m ----"
          npx --yes vercel@58.7.1 logs \
            --level error \
            --expand \
            --since 10m \
            --project "$VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --token "$VERCEL_TOKEN" \
            --non-interactive || true
