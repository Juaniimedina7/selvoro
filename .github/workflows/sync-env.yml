name: Sync env to Vercel

# Sync manual, on-demand, de secrets de GitHub → variables de entorno de Vercel.
# Por default solo agrega las que FALTAN en Vercel (no pisa las existentes).
# force_update_keys permite forzar la actualización de keys puntuales que ya
# existen (ej. rotar una API key inválida) — lista separada por comas. No
# deploya. El deploy lo maneja la integración nativa de Vercel en cada push
# a main.
on:
  workflow_dispatch:
    inputs:
      force_update_keys:
        description: "Keys a forzar actualización aunque ya existan en Vercel (separadas por coma, ej. ANTHROPIC_API_KEY)"
        required: false
        default: ""

env:
  # No son secretos: son los IDs del proyecto selvoro en Vercel.
  VERCEL_ORG_ID: team_klaQ4k4O3uyzx9gNCCsGWN91
  VERCEL_PROJECT_ID: prj_jkHBpnbq4mBSnaVkpAkvufSIzHiB

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync env vars to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          FORCE_UPDATE_KEYS: ${{ inputs.force_update_keys }}
        run: node .github/scripts/sync-env.mjs
